name: Mac Build

on:
  workflow_dispatch:
  # 如需推送即构建，取消下方注释并改为你的默认分支名
  # push:
  #   branches: [main, master]

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：原生 arm64，ssh2 原生模块架构匹配
          - arch: arm64
            runner: macos-14
          # Intel：原生 x64
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 重编译原生模块 ssh2，使其匹配当前 Runner 的架构与 Electron 版本
      - name: Rebuild native modules (ssh2) for ${{ matrix.arch }}
        run: npm run rebuild

      - name: Build renderer & package dmg (${{ matrix.arch }})
        run: |
          npx vite build
          npx electron-builder --mac --${{ matrix.arch }}
        env:
          # 使用国内镜像加速 Electron 二进制下载（Runner 在境外时可去掉）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

          # ===== 可选：Apple 签名与公证（需 secrets）=====
          # 不配置时产出未签名 dmg，用户首次打开会提示"已损坏"，需用 xattr -cr 绕过
          # CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}-dmg
          path: release/*.dmg
          if-no-files-found: error

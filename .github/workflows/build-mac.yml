name: Build macOS App

on:
  push:
    branches: [ "master" ]     # 推送到 master 分支时触发
  pull_request:
    branches: [ "master" ]     # PR 到 master 时触发
  workflow_dispatch:           # 允许手动点击运行

jobs:
  build:
    runs-on: macos-latest      # 使用 macOS 运行器
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. 设置 Node.js（如果你的项目是 Node.js）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 3. 安装依赖
      - name: Install dependencies
        run: npm install
      
      # 4. 构建项目（根据你的项目修改命令）
      - name: Build project
        run: npm run build
      
      # 5. 打包成 Mac 应用（这里需要根据你的项目调整）
      - name: Package for macOS
        run: build:mac:arm64
      
      # 6. 上传构建产物（打包好的 .app 或 .dmg）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/          # 修改为你的打包输出目录
